name: bankr-skills

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'bankr/**'
      - '.github/workflows/bankr-skills.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bankr
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install pinned packages
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test test/

      - name: Pinned tokens still match mainnet
        run: bun test/verify-tokens.mjs
